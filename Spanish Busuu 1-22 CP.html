<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #c62828;
            --primary-dark: #8e0000;
            --secondary: #f57c00;
            --accent: #ffb300;
            --bg-color: #fffde7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 320px;
            background-color: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
            overflow-y: auto;
            max-height: 100vh;
        }

        #sidebar h1 {
            font-size: 1.5rem;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .set-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 15px;
            text-align: left;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .set-btn:hover {
            background: var(--secondary);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .set-btn.active {
            background: var(--accent);
            color: var(--primary-dark);
            font-weight: bold;
            border-color: white;
        }

        /* Main Content Styles */
        #main-content {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 100vh;
            overflow-y: auto;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 700px;
        }

        .header-container h2 {
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #ffe0b2;
            padding: 5px;
            border-radius: 30px;
        }

        .tab-btn {
            padding: 10px 25px;
            border: none;
            background: transparent;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-dark);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow);
        }

        /* Flashcard Mode */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 550px;
            height: 320px;
            margin-bottom: 25px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-radius: var(--border-radius);
            background: var(--card-bg);
            border: 3px solid var(--accent);
            text-align: center;
        }

        .card-front {
            color: var(--primary-dark);
        }

        .card-back {
            background: #fff3e0;
            color: var(--text-color);
            transform: rotateY(180deg);
        }

        .card-term {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-prompt {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .ctrl-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s ease;
            box-shadow: var(--shadow);
        }

        .ctrl-btn:hover {
            background: var(--primary-dark);
        }

        .counter {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        /* Written Practice Mode */
        .practice-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 2px solid var(--accent);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prompt-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-dark);
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-weight: 600;
            color: #555;
        }

        .text-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .text-input:focus {
            border-color: var(--secondary);
        }

        .feedback {
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }

        .feedback.correct {
            color: #2e7d32;
        }

        .feedback.incorrect {
            color: #c62828;
        }

        .hidden {
            display: none !important;
        }

        /* Conjugation Matrix View */
        .conjugation-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .conj-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .conj-item label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-dark);
        }

        /* List View */
        .list-container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid #ffe0b2;
            overflow: hidden;
        }

        .list-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
        }

        .list-row:nth-child(even) {
            background-color: #fffde7;
        }

        .list-es {
            font-weight: bold;
            color: var(--primary-dark);
        }

        .list-en {
            color: #555;
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h1>Español A1</h1>
        <div id="set-buttons-container"></div>
    </nav>

    <main id="main-content">
        <div class="header-container">
            <h2 id="current-set-title">Cargando...</h2>
            <div class="mode-tabs">
                <button class="tab-btn active" onclick="switchMode('cards')">Tarjetas (Cards)</button>
                <button class="tab-btn" onclick="switchMode('practice')">Práctica (Write)</button>
                <button class="tab-btn" onclick="switchMode('list')">Lista (List)</button>
            </div>
        </div>

        <!-- Mode 1: Flashcards -->
        <div id="cards-view" class="mode-view">
            <div class="flashcard-container">
                <div class="flashcard" id="card" onclick="flipCard()">
                    <div class="card-front">
                        <div class="card-prompt">Español</div>
                        <div class="card-term" id="card-front-text">---</div>
                    </div>
                    <div class="card-back">
                        <div class="card-prompt">Inglés</div>
                        <div class="card-term" id="card-back-text">---</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevCard()">Anterior</button>
                <span class="counter" id="card-counter">0 / 0</span>
                <button class="ctrl-btn" onclick="nextCard()">Siguiente</button>
            </div>
        </div>

        <!-- Mode 2: Practice / Conjugation Writing -->
        <div id="practice-view" class="mode-view hidden">
            <div class="practice-container">
                <div class="prompt-box" id="practice-prompt">---</div>
                
                <!-- Standard Single Vocabulary Input -->
                <div id="vocab-input-block" class="input-group">
                    <label for="practice-input">Traducción al español:</label>
                    <input type="text" id="practice-input" class="text-input" placeholder="Escribe aquí..." autocomplete="off">
                </div>

                <!-- Conjugation Grid Input (Only for Conjugation Set) -->
                <div id="conj-input-block" class="conjugation-grid hidden">
                    <div class="conj-item">
                        <label>Yo:</label>
                        <input type="text" id="conj-yo" class="text-input" autocomplete="off">
                    </div>
                    <div class="conj-item">
                        <label>Tú:</label>
                        <input type="text" id="conj-tu" class="text-input" autocomplete="off">
                    </div>
                    <div class="conj-item">
                        <label>Él/Ella/Ud.:</label>
                        <input type="text" id="conj-el" class="text-input" autocomplete="off">
                    </div>
                    <div class="conj-item">
                        <label>Nosotros/as:</label>
                        <input type="text" id="conj-nosotros" class="text-input" autocomplete="off">
                    </div>
                    <div class="conj-item">
                        <label>Vosotros/as:</label>
                        <input type="text" id="conj-vosotros" class="text-input" autocomplete="off">
                    </div>
                    <div class="conj-item">
                        <label>Ellos/Ellas/Uds.:</label>
                        <input type="text" id="conj-ellos" class="text-input" autocomplete="off">
                    </div>
                </div>

                <div class="feedback" id="practice-feedback"></div>
                <div class="controls" style="justify-content: center;">
                    <button class="ctrl-btn" onclick="checkAnswer()">Comprobar</button>
                    <button class="ctrl-btn" onclick="nextPracticeItem()">Siguiente</button>
                </div>
            </div>
        </div>

        <!-- Mode 3: Overview List -->
        <div id="list-view" class="mode-view hidden">
            <div class="list-container" id="list-container"></div>
        </div>
    </main>

                    { es: "Jugar", en: "To play" },

                    { es: "Descansar", en: "To rest" },
                    { es: "¿Qué te gusta hacer?", en: "What do you like to do?" },
                    { es: "Me gusta... / No me gusta...", en: "I like... / I don't like..." }
                ]
            },
            {
                id: 23,
                title: "Conjugaciones (Verbos claves)",
                type: "conjugation",
                items: [
                    {
                        infinitive: "Ser",
                        translation: "To be (permanent)",
                        conj: { yo: "soy", tu: "eres", el: "es", nosotros: "somos", vosotros: "sois", ellos: "son" }
                    },
                    {
                        infinitive: "Estar",
                        translation: "To be (temporary/location)",
                        conj: { yo: "estoy", tu: "estás", el: "está", nosotros: "estamos", vosotros: "estáis", ellos: "están" }
                    },
                    {
                        infinitive: "Tener",
                        translation: "To have",
                        conj: { yo: "tengo", tu: "tienes", el: "tiene", nosotros: "tenemos", vosotros: "tenéis", ellos: "tienen" }
                    },
                    {
                        infinitive: "Vivir",
                        translation: "To live",
                        conj: { yo: "vivo", tu: "vives", el: "vive", nosotros: "vivimos", vosotros: "vivís", ellos: "viven" }
                    },
                    {
                        infinitive: "Hablar",
                        translation: "To speak",
                        conj: { yo: "hablo", tu: "hablas", el: "habla", nosotros: "hablamos", vosotros: "habláis", ellos: "hablan" }
                    },
                    {
                        infinitive: "Trabajar",
                        translation: "To work",
                        conj: { yo: "trabajo", tu: "trabajas", el: "trabaja", nosotros: "trabajamos", vosotros: "trabajáis", ellos: "trabajan" }
                    },
                    {
                        infinitive: "Estudiar",
                        translation: "To study",
                        conj: { yo: "estudio", tu: "estudias", el: "estudia", nosotros: "estudiamos", vosotros: "estudiáis", ellos: "estudian" }
                    },
                    {
                        infinitive: "Hacer",
                        translation: "To do / make",
                        conj: { yo: "hago", tu: "haces", el: "hace", nosotros: "hacemos", vosotros: "hacéis", ellos: "hacen" }
                    }
                ]
            }
        ];

        let currentSetIndex = 0;
        let currentItemIndex = 0;
        let currentMode = 'cards'; // 'cards', 'practice', 'list'

        // DOM elements
        const setButtonsContainer = document.getElementById('set-buttons-container');
        const currentSetTitle = document.getElementById('current-set-title');
        const cardElement = document.getElementById('card');
        const cardFrontText = document.getElementById('card-front-text');
        const cardBackText = document.getElementById('card-back-text');
        const cardCounter = document.getElementById('card-counter');
        const practicePrompt = document.getElementById('practice-prompt');
        const practiceInput = document.getElementById('practice-input');
        const practiceFeedback = document.getElementById('practice-feedback');
        const listContainer = document.getElementById('list-container');
        const vocabInputBlock = document.getElementById('vocab-input-block');
        const conjInputBlock = document.getElementById('conj-input-block');

        // Initialize App
        function init() {
            renderSidebar();
            loadSet(0);
        }

        function renderSidebar() {
            setButtonsContainer.innerHTML = '';
            studySets.forEach((set, index) => {
                const btn = document.createElement('button');
                btn.className = `set-btn ${index === currentSetIndex ? 'active' : ''}`;
                btn.innerText = set.title;
                btn.onclick = () => loadSet(index);
                setButtonsContainer.appendChild(btn);
            });
        }

        function loadSet(index) {
            currentSetIndex = index;
            currentItemIndex = 0;
            renderSidebar();

            const set = studySets[currentSetIndex];
            currentSetTitle.innerText = set.title;

            if (set.type === 'conjugation') {
                vocabInputBlock.classList.add('hidden');
                conjInputBlock.classList.remove('hidden');
            } else {
                vocabInputBlock.classList.remove('hidden');
                conjInputBlock.classList.add('hidden');
            }

            updateView();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.mode-view').forEach(view => view.classList.add('hidden'));
            document.getElementById(`${mode}-view`).classList.remove('hidden');

            updateView();
        }

        function updateView() {
            const set = studySets[currentSetIndex];
            
            if (currentMode === 'cards') {
                cardElement.classList.remove('flipped');
                const item = set.items[currentItemIndex];
                if (set.type === 'conjugation') {
                    cardFrontText.innerText = item.infinitive;
                    cardBackText.innerText = `${item.translation}\n\nYo ${item.conj.yo} | Tú ${item.conj.tu}\nÉl ${item.conj.el} | Nos. ${item.conj.nosotros}\nVos. ${item.conj.vosotros} | Ellos ${item.conj.ellos}`;
                } else {
                    cardFrontText.innerText = item.es;
                    cardBackText.innerText = item.en;
                }
                cardCounter.innerText = `${currentItemIndex + 1} / ${set.items.length}`;
            } 
            else if (currentMode === 'practice') {
                practiceFeedback.innerText = '';
                practiceFeedback.className = 'feedback';
                const item = set.items[currentItemIndex];

                if (set.type === 'conjugation') {
                    practicePrompt.innerText = `Conjugate: ${item.infinitive} (${item.translation})`;
                    clearConjInputs();
                } else {
                    practicePrompt.innerText = item.en;
                    practiceInput.value = '';
                }
            } 
            else if (currentMode === 'list') {
                listContainer.innerHTML = '';
                set.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'list-row';
                    if (set.type === 'conjugation') {
                        row.innerHTML = `
                            <span class="list-es">${item.infinitive} (${item.translation})</span>
                            <span class="list-en">yo ${item.conj.yo}, tú ${item.conj.tu}, él ${item.conj.el}, nos. ${item.conj.nosotros}, vos. ${item.conj.vosotros}, ellos ${item.conj.ellos}</span>
                        `;
                    } else {
                        row.innerHTML = `
                            <span class="list-es">${item.es}</span>
                            <span class="list-en">${item.en}</span>
                        `;
                    }
                    listContainer.appendChild(row);
                });
            }
        }

        // Card Functions
        function flipCard() {
            cardElement.classList.toggle('flipped');
        }

        function nextCard() {
            const set = studySets[currentSetIndex];
            currentItemIndex = (currentItemIndex + 1) % set.items.length;
            updateView();
        }

        function prevCard() {
            const set = studySets[currentSetIndex];
            currentItemIndex = (currentItemIndex - 1 + set.items.length) % set.items.length;
            updateView();
        }

        // Practice Functions
        function clearConjInputs() {
            ['yo', 'tu', 'el', 'nosotros', 'vosotros', 'ellos'].forEach(id => {
                document.getElementById(`conj-${id}`).value = '';
            });
        }

        function normalizeText(text) {
            return text.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function checkAnswer() {
            const set = studySets[currentSetIndex];
            const item = set.items[currentItemIndex];

            if (set.type === 'conjugation') {
                const userConj = {
                    yo: normalizeText(document.getElementById('conj-yo').value),
                    tu: normalizeText(document.getElementById('conj-tu').value),
                    el: normalizeText(document.getElementById('conj-el').value),
                    nosotros: normalizeText(document.getElementById('conj-nosotros').value),
                    vosotros: normalizeText(document.getElementById('conj-vosotros').value),
                    ellos: normalizeText(document.getElementById('conj-ellos').value)
                };

                const isCorrect = 
                    userConj.yo === normalizeText(item.conj.yo) &&
                    userConj.tu === normalizeText(item.conj.tu) &&
                    userConj.el === normalizeText(item.conj.el) &&
                    userConj.nosotros === normalizeText(item.conj.nosotros) &&
                    userConj.vosotros === normalizeText(item.conj.vosotros) &&
                    userConj.ellos === normalizeText(item.conj.ellos);

                if (isCorrect) {
                    practiceFeedback.innerText = "¡Correcto! Excelente.";
                    practiceFeedback.className = "feedback correct";
                } else {
                    practiceFeedback.innerText = `Incorrecto. Solución: yo ${item.conj.yo}, tú ${item.conj.tu}, él ${item.conj.el}, nos. ${item.conj.nosotros}, vos. ${item.conj.vosotros}, ellos ${item.conj.ellos}`;
                    practiceFeedback.className = "feedback incorrect";
                }
            } else {
                const userVal = normalizeText(practiceInput.value);
                const targetVal = normalizeText(item.es);

                // Allow matching alternative options separated by slashes
                const options = targetVal.split('/').map(opt => opt.trim());
                const isCorrect = options.some(opt => userVal === opt || userVal === targetVal);

                if (isCorrect) {
                    practiceFeedback.innerText = "¡Correcto!";
                    practiceFeedback.className = "feedback correct";
                } else {
                    practiceFeedback.innerText = `Incorrecto. Respuesta correcta: ${item.es}`;
                    practiceFeedback.className = "feedback incorrect";
                }
            }
        }

        function nextPracticeItem() {
            nextCard();
        }

        // Initialize page execution
        window.onload = init;
    </script>
</body>
</html>
